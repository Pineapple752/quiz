<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why Wrong? Quizzes</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6f0ef;--ink:#0e2a2b;--panel:#fff;--accent:#0b7a75;--ok:#1b7f4b;--bad:#b3322f;--line:#b9cfcd}
@media(prefers-color-scheme:dark){:root{--bg:#0c1d1e;--ink:#e3f1ef;--panel:#12292b;--accent:#4fd1c5;--ok:#5fd394;--bad:#ff8a84;--line:#2b4a4c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 'Bricolage Grotesque',system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:32px 20px 64px}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin:.2em 0 .4em}
h2{font-size:1.25rem;font-weight:600;margin:0 0 .8em;line-height:1.35}
.sub{color:var(--ink);opacity:.7;margin:0 0 1.4em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.card:hover:not(:disabled){border-color:var(--accent)}
.card:disabled{opacity:.45;cursor:not-allowed}
.card b{font-weight:600}.card span{font-size:.9rem;opacity:.7}
.back{background:none;border:0;padding:0;margin-bottom:18px;color:var(--accent);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:22px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.opt{display:block;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--panel))}
.fb{border-left:4px solid var(--accent);background:var(--panel);padding:12px 14px;margin:16px 0;border-radius:0 10px 10px 0}
.fb p{margin:0 0 .5em}.fb p:last-child{margin:0}
.go{background:var(--accent);color:var(--bg);border:0;border-radius:10px;padding:11px 22px;font-weight:600}
.big{font-size:3rem;font-weight:800;margin:0}
ul{padding-left:1.1em}li{margin-bottom:.6em}
</style>
</head>
<body>
<main id="app"></main>
<script src="apchem.js"></script>
<script>
const app=document.getElementById('app');
let course,pool,idx,score,missed,label;
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const ready=c=>c.topics.filter(t=>t.qs.length);

function home(){
  app.innerHTML='<h1>Why Wrong?</h1><p class="sub">Quizzes that explain every wrong answer, not just the right one.</p>'+
  COURSES.map((c,i)=>`<button class="card" onclick="pickCourse(${i})"><b>${c.name}</b><span>${ready(c).length} topics ready</span></button>`).join('');
}
function pickCourse(i){
  course=COURSES[i];
  const n=ready(course).reduce((s,t)=>s+t.qs.length,0);
  app.innerHTML=`<button class="back" onclick="home()">‹ All courses</button><h1>${course.name}</h1><p class="sub">How do you want to study?</p>
  <button class="card" onclick="chapters()"><b>Pick a chapter</b><span>Drill one topic at a time</span></button>
  <button class="card" onclick="start(ready(course).flatMap(t=>t.qs),'Whole course review')"><b>Whole course review</b><span>${n} questions from every ready topic, shuffled</span></button>`+(course.poly?`<button class="card" onclick="drill()"><b>Polyatomic drill</b><span>20 quick cards, name ↔ formula, with a correction on every miss</span></button>`:'');
}
function chapters(){
  app.innerHTML=`<button class="back" onclick="pickCourse(COURSES.indexOf(course))">‹ ${course.name}</button><h1>Pick a chapter</h1>`+
  course.topics.map((t,i)=>`<button class="card" ${t.qs.length?'':'disabled'} onclick="start(course.topics[${i}].qs,course.topics[${i}].name)"><b>${t.name}</b><span>${t.qs.length?t.qs.length+' questions':'Coming soon'}</span></button>`).join('');
}
function start(qs,name){pool=shuffle(qs);label=name;idx=0;score=0;missed=[];show()}
function show(){
  const q=pool[idx];
  app.innerHTML=`<button class="back" onclick="pickCourse(COURSES.indexOf(course))">‹ Quit</button>
  <div class="bar"><i style="width:${idx/pool.length*100}%"></i></div>
  <p class="sub">${label} · ${idx+1} of ${pool.length}</p><h2>${q.q}</h2>`+
  q.o.map((o,k)=>`<button class="opt" onclick="answer(${k})">${o}</button>`).join('')+'<div id="fb"></div>';
}
function answer(k){
  const q=pool[idx],opts=[...document.querySelectorAll('.opt')];
  opts.forEach((b,i)=>{b.disabled=true;if(i==q.a)b.classList.add('ok');else if(i==k)b.classList.add('no')});
  let h;
  if(k==q.a){score++;h=`<p><b>Correct.</b> ${q.f[q.a]}</p>`}
  else{missed.push({q:q.q,pick:q.o[k],why:q.f[k],right:q.o[q.a]});h=`<p><b>Not quite.</b> ${q.f[k]}</p><p><b>Answer: ${q.o[q.a]}.</b> ${q.f[q.a]}</p>`}
  const last=idx==pool.length-1;
  document.getElementById('fb').innerHTML=`<div class="fb" role="status">${h}</div><button class="go" id="next" onclick="${last?'finish()':'idx++;show()'}">${last?'See results':'Next question'}</button>`;
  document.getElementById('next').focus();
}
function finish(){
  app.innerHTML=`<h1>${label}</h1><p class="big">${score}/${pool.length}</p><p class="sub">${missed.length?'Review what you missed:':'Perfect run.'}</p>`+
  (missed.length?'<ul>'+missed.map(m=>`<li><b>${m.q}</b><br>You picked ${m.pick}. ${m.why}<br>Answer: ${m.right}</li>`).join('')+'</ul>':'')+
  `<button class="go" onclick="start(pool,label)">Try again</button> <button class="card" style="display:inline-block;width:auto" onclick="pickCourse(COURSES.indexOf(course))">Back to ${course.name}</button>`;
}
function drill(){
  const L=course.poly;
  pool=shuffle(L).slice(0,20).map(ion=>{
    const toName=Math.random()<.5,rest=L.filter(x=>x!==ion);
    const ds=shuffle(rest.filter(x=>x.g==ion.g)).concat(shuffle(rest.filter(x=>x.g!=ion.g))).slice(0,3);
    const all=shuffle([ion,...ds]);
    return{q:toName?`Name this ion: ${ion.f}`:`Which is the formula of ${ion.n}?`,
      o:all.map(x=>toName?x.n:x.f),a:all.indexOf(ion),
      f:all.map(x=>x===ion?`${ion.f} is ${ion.n}.`:toName?`${x.n} is ${x.f}, not ${ion.f}.`:`${x.f} is ${x.n}, not ${ion.n}.`)};
  });
  label='Polyatomic drill';idx=0;score=0;missed=[];show();
}
home();
</script>
</body>
</html>
