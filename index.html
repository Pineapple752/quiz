<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AP Quizzes</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b14;--card:#15152a;--line:#26264a;--ink:#f3f3ff;--dim:#9a9ac4;--a:#8b5cf6;--b:#22d3ee;--ok:#34d399;--bad:#fb7185;--gold:#fbbf24}
@media(prefers-color-scheme:light){:root{--bg:#f4f3ff;--card:#fff;--line:#d9d6f5;--ink:#15122e;--dim:#5b5886}}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#8b5cf633,transparent),var(--bg);color:var(--ink);font:16px/1.5 Sora,system-ui,sans-serif;min-height:100vh}
main{max-width:620px;margin:0 auto;padding:18px 16px 70px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.logo{font-weight:800;letter-spacing:-.03em;font-size:1.15rem;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.sp{flex:1}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:.82rem;font-weight:600;white-space:nowrap}
h1{font-size:2.1rem;line-height:1.1;font-weight:800;letter-spacing:-.04em;margin:.1em 0 .3em}
.sub{color:var(--dim);margin:0 0 20px}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px;transition:transform .12s,border-color .12s}
.card:hover:not(:disabled){transform:translateY(-2px);border-color:var(--a)}
.card:disabled{opacity:.4;cursor:not-allowed}
.card b{display:block;font-weight:600}.card small{color:var(--dim)}
.card.hero{background:linear-gradient(135deg,#8b5cf6,#22d3ee);border:0;color:#fff}
.card.hero small{color:#ffffffd0}
.back{background:none;border:0;padding:0;margin-bottom:16px;color:var(--b);font-weight:600}
.meter{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:9px;transition:width .3s}
.pills{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.pill{background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:7px 14px;font-weight:600;font-size:.9rem}
.pill.on{background:var(--a);border-color:var(--a);color:#fff}
.hud{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:.85rem;color:var(--dim)}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px;transition:transform .1s,border-color .1s}
.opt:hover:not(:disabled){border-color:var(--b);transform:translateX(3px)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:800}
.opt.ok{border-color:var(--ok);background:#34d39922}.opt.ok .k{background:var(--ok);color:#06251a}
.opt.no{border-color:var(--bad);background:#fb718522;animation:shake .35s}.opt.no .k{background:var(--bad);color:#2a0710}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.q{font-size:1.2rem;font-weight:600;line-height:1.4;margin:6px 0 18px}
.tag{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:6px;background:var(--gold);color:#3b2a00;margin-bottom:6px}
.fb{border-radius:14px;padding:13px 15px;margin:14px 0;background:var(--card);border:1.5px solid var(--line)}
.fb.good{border-color:var(--ok)}.fb.bad{border-color:var(--bad)}
.fb p{margin:0 0 .5em}.fb p:last-child{margin:0}
.go{background:linear-gradient(90deg,var(--a),var(--b));color:#fff;border:0;border-radius:14px;padding:13px 26px;font-weight:800;width:100%}
.big{font-size:4rem;font-weight:800;letter-spacing:-.05em;margin:0;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.pop{position:fixed;right:18px;top:70px;font-weight:800;color:var(--gold);animation:up .9s forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-34px);opacity:0}}
li{margin-bottom:.8em}
</style>
</head>

const COURSES=[{id:'apchem',name:'AP Chemistry',poly:POLY,topics:[
{name:"Polyatomic Ions",qs:[
Q("Which is the formula and charge of the sulfate ion?",["SO₃²⁻","SO₄²⁻","SO₄⁻","S₂O₃²⁻"],1,["That's sulfite, which has one fewer oxygen.","Sulfate is SO₄²⁻: four oxygens and a 2− charge.","Right atoms, wrong charge. Sulfate is 2−.","That's thiosulfate, which has two sulfurs."]),
Q("Which is the formula of the nitrate ion?",["NO₂⁻","NO₃⁻","NO₃²⁻","NH₄⁺"],1,["That's nitrite, one fewer oxygen.","Nitrate is NO₃⁻ with a 1− charge.","Right atoms, but nitrate's charge is 1−, not 2−.","That's ammonium, a cation."]),
Q("Which of these common polyatomic ions is a cation?",["OH⁻","NH₄⁺","CN⁻","NO₃⁻"],1,["Hydroxide is an anion.","Ammonium is the one common polyatomic cation.","Cyanide is an anion.","Nitrate is an anion."]),
Q("What is the charge on the phosphate ion, PO₄?",["1−","2−","3−","3+"],2,["1− fits nitrate or hydroxide, not phosphate.","2− fits sulfate or carbonate, not phosphate.","Phosphate is PO₄³⁻.","Oxyanions like phosphate are negative, never positive."]),
Q("What is the name of ClO₃⁻?",["Chlorite","Chlorate","Perchlorate","Hypochlorite"],1,["Chlorite is ClO₂⁻, one fewer oxygen.","Chlorate is the '-ate' base form: ClO₃⁻.","Perchlorate is ClO₄⁻, one more oxygen.","Hypochlorite is ClO⁻."]),
Q("What is the formula of calcium hydroxide?",["CaOH","Ca(OH)₂","Ca₂OH","CaO₂H₂"],1,["Ca²⁺ needs two OH⁻ ions to balance, not one.","Ca²⁺ + 2 OH⁻. Parentheses keep OH together as one unit.","A subscript 2 on Ca would give 4+ total, not balance the 2+.","Without parentheses the OH unit is broken apart and the formula is misread."]),
Q("What is the formula of aluminum sulfate?",["AlSO₄","Al₂SO₄","Al(SO₄)₃","Al₂(SO₄)₃"],3,["Al³⁺ and SO₄²⁻ do not balance 1:1.","Only fixes the aluminum: 6+ vs 2−.","Needs two Al to match three sulfates: 3+ vs 6− is unbalanced.","2(3+) = 6+ and 3(2−) = 6−, so the charges cancel."]),
Q("What is HCO₃⁻ called?",["Carbonate","Bicarbonate (hydrogen carbonate)","Carbide","Hydroxycarbonate"],1,["Carbonate is CO₃²⁻, with no hydrogen.","Right. It's carbonate plus one H⁺, so the charge drops to 1−.","Carbide is C⁴⁻, a monatomic ion.","Not a standard name for this ion."]),
Q("What is the name of SO₃²⁻?",["Sulfate","Sulfite","Sulfide","Thiosulfate"],1,["Sulfate is SO₄²⁻, one more oxygen.","'-ite' means one fewer oxygen than '-ate': SO₃²⁻.","Sulfide is just S²⁻.","Thiosulfate is S₂O₃²⁻."]),
Q("What is the formula of ammonium phosphate?",["NH₄PO₄","(NH₄)₃PO₄","NH₄(PO₄)₃","(NH₄)₂PO₄"],1,["1+ and 3− don't cancel.","Three NH₄⁺ (3+) balance one PO₄³⁻ (3−).","That puts the 3 on phosphate, giving 1+ vs 9−.","Two NH₄⁺ gives only 2+, which doesn't cancel 3−."]),
Q("Which is the carbonate ion?",["CO₃²⁻","CO₂²⁻","HCO₃⁻","C₂O₄²⁻"],0,["Carbonate is CO₃²⁻.","That's not a standard ion.","That's hydrogen carbonate.","That's oxalate."]),
Q("Which is the acetate ion?",["C₂H₃O₂⁻","CO₃²⁻","C₂O₄²⁻","CH₃⁻"],0,["Acetate is C₂H₃O₂⁻ (also written CH₃COO⁻).","That's carbonate.","That's oxalate.","That's not acetate."]),
Q("Which is the oxalate ion?",["C₂O₄²⁻","C₂H₃O₂⁻","CO₃²⁻","C₂O₃²⁻"],0,["Oxalate is C₂O₄²⁻.","That's acetate.","That's carbonate.","That isn't a standard ion."]),
Q("What is NH₄⁺ called?",["Ammonia","Ammonium","Amide","Nitrate"],1,["Ammonia is neutral NH₃.","Ammonium is NH₄⁺.","Amide is NH₂⁻.","Nitrate is NO₃⁻."]),
Q("What is H₃O⁺ called?",["Hydroxide","Hydronium","Hydride","Peroxide"],1,["Hydroxide is OH⁻.","Hydronium is H₃O⁺, the acid ion in water.","Hydride is H⁻.","Peroxide is O₂²⁻."]),
Q("What is CN⁻ called?",["Cyanate","Cyanide","Nitrile","Thiocyanate"],1,["Cyanate is OCN⁻.","CN⁻ is cyanide.","Nitrile is an organic group.","Thiocyanate is SCN⁻."]),
Q("What is MnO₄⁻ called?",["Manganate","Permanganate","Manganite","Manganese oxide"],1,["Manganate is MnO₄²⁻.","Permanganate is MnO₄⁻.","Not a standard name.","That's an oxide compound."]),
Q("What is Cr₂O₇²⁻ called?",["Chromate","Dichromate","Chromite","Chromium oxide"],1,["Chromate is CrO₄²⁻.","Two chromiums make dichromate.","Not a standard name.","That's a different compound."]),
Q("What is PO₃³⁻ called?",["Phosphate","Phosphite","Phosphide","Hypophosphite"],1,["Phosphate is PO₄³⁻.","Phosphite has one fewer oxygen.","Phosphide is P³⁻.","Hypophosphite has two fewer oxygens."]),
Q("What is ClO⁻ called?",["Chlorite","Hypochlorite","Perchlorate","Chloride"],1,["Chlorite is ClO₂⁻.","Hypochlorite has the fewest oxygens.","Perchlorate is ClO₄⁻.","Chloride is Cl⁻."]),
Q("What is ClO₄⁻ called?",["Chlorate","Perchlorate","Chlorite","Hypochlorite"],1,["Chlorate is ClO₃⁻.","'Per-' means one more oxygen than chlorate.","Chlorite is ClO₂⁻.","Hypochlorite is ClO⁻."]),
Q("What is NO₂⁻ called?",["Nitrate","Nitrite","Nitride","Nitrogen dioxide"],1,["Nitrate is NO₃⁻.","'-ite' means one fewer oxygen than nitrate.","Nitride is N³⁻.","That's the neutral molecule."]),
Q("What is BrO₃⁻ called?",["Bromide","Bromite","Bromate","Perbromate"],2,["Bromide is Br⁻.","Bromite is BrO₂⁻.","It follows chlorate's pattern.","Perbromate is BrO₄⁻."]),
Q("What is S₂O₃²⁻ called?",["Sulfite","Thiosulfate","Sulfate","Persulfate"],1,["Sulfite is SO₃²⁻.","Thio- means one O replaced by S.","Sulfate is SO₄²⁻.","Persulfate is S₂O₈²⁻."]),
Q("What is HSO₄⁻ called?",["Sulfite","Hydrogen sulfate (bisulfate)","Hydrogen sulfite","Sulfide"],1,["Sulfite is SO₃²⁻.","SO₄²⁻ plus one H⁺.","That's HSO₃⁻.","Sulfide is S²⁻."]),
Q("What is H₂PO₄⁻ called?",["Phosphate","Hydrogen phosphate","Dihydrogen phosphate","Phosphite"],2,["That's PO₄³⁻.","That's HPO₄²⁻.","Two hydrogens added to phosphate, with a 1− charge.","That's PO₃³⁻."]),
Q("What is the charge on the hydrogen phosphate ion, HPO₄?",["1−","2−","3−","4−"],1,["That's dihydrogen phosphate.","Phosphate is 3−, and adding one H⁺ makes 2−.","That's phosphate.","No common ion has this charge."]),
Q("What is the formula of sodium sulfate?",["NaSO₄","Na₂SO₄","Na(SO₄)₂","Na₂S"],1,["1+ and 2− don't balance.","Two Na⁺ balance one SO₄²⁻.","That gives 1+ and 4−.","That's sodium sulfide."]),
Q("What is the formula of magnesium nitrate?",["MgNO₃","Mg(NO₃)₂","Mg₂NO₃","Mg₂(NO₃)"],1,["2+ and 1− don't balance.","One Mg²⁺ needs two NO₃⁻.","That gives 4+ and 1−.","That puts the subscript on Mg."]),
Q("What is the formula of potassium permanganate?",["KMnO₄","K₂MnO₄","K(MnO₄)₂","KMn₂O₄"],0,["K⁺ and MnO₄⁻ balance 1:1.","That's potassium manganate.","That's an unbalanced ratio.","That breaks up the ion."]),
Q("What is the formula of calcium phosphate?",["CaPO₄","Ca₂PO₄","Ca₃(PO₄)₂","Ca₂(PO₄)₃"],2,["2+ and 3− don't balance.","4+ and 3− don't balance.","3(2+) = 6+ and 2(3−) = 6−.","That swaps the subscripts."]),
Q("What is the formula of iron(III) sulfate?",["FeSO₄","Fe₂(SO₄)₃","Fe₃(SO₄)₂","Fe(SO₄)₃"],1,["That's iron(II) sulfate.","2(3+) = 6+ and 3(2−) = 6−.","That swaps the subscripts.","That gives 3+ and 6−."]),
Q("What is the formula of ammonium sulfate?",["NH₄SO₄","(NH₄)₂SO₄","NH₄(SO₄)₂","(NH₄)₃SO₄"],1,["1+ and 2− don't balance.","Two NH₄⁺ balance one SO₄²⁻.","That makes two sulfates.","That gives 3+ and 2−."]),
Q("What is the formula of barium chlorate?",["BaClO₃","Ba(ClO₃)₂","Ba₂ClO₃","BaCl₂O₃"],1,["2+ and 1− don't balance.","Ba²⁺ needs two ClO₃⁻.","That gives 4+ and 1−.","That breaks up the ion."]),
Q("What is the formula of zinc carbonate?",["ZnCO₃","Zn₂CO₃","Zn(CO₃)₂","ZnC₂O₃"],0,["Zn²⁺ and CO₃²⁻ balance 1:1.","That gives 4+ and 2−.","That gives 2+ and 4−.","That breaks up the ion."]),
Q("What is the name of Cu(NO₃)₂?",["Copper nitrate","Copper(II) nitrate","Copper(I) nitrate","Copper dinitrate"],1,["Copper needs a Roman numeral.","Two NO₃⁻ means Cu²⁺.","That would be CuNO₃.","Prefixes aren't used in ionic names."]),
Q("What is the name of NaClO?",["Sodium chlorite","Sodium hypochlorite","Sodium chlorate","Sodium perchlorate"],1,["That's NaClO₂.","ClO⁻ is hypochlorite.","That's NaClO₃.","That's NaClO₄."]),
Q("What is the name of NaHCO₃?",["Sodium carbonate","Sodium hydrogen carbonate","Sodium hydroxide","Sodium oxalate"],1,["That's Na₂CO₃.","Also called baking soda.","That's NaOH.","That's Na₂C₂O₄."]),
Q("What is the name of K₂Cr₂O₇?",["Potassium chromate","Potassium dichromate","Potassium chromite","Potassium chromium oxide"],1,["That's K₂CrO₄.","Contains Cr₂O₇²⁻.","Not a standard name.","That's a different compound."]),
Q("What is the name of Fe(OH)₃?",["Iron hydroxide","Iron(III) hydroxide","Iron(II) hydroxide","Iron trihydroxide"],1,["Iron needs a Roman numeral.","Three OH⁻ means Fe³⁺.","That's Fe(OH)₂.","Prefixes aren't used in ionic names."]),
Q("Compared with the '-ate' ion of the same element, the '-ite' ion has:",["One fewer oxygen","One more oxygen","A different charge","No oxygen"],0,["Chlorite has one fewer oxygen than chlorate.","That's 'per-'.","The charge usually stays the same.","Both contain oxygen."]),
Q("Which ion does not have a 1− charge?",["NO₃⁻","ClO₃⁻","SO₄²⁻","BrO₃⁻"],2,["1−.","1−.","Sulfate is 2−.","1−."]),
Q("How many oxygen atoms are in one formula unit of Al₂(SO₄)₃?",["4","7","12","3"],2,["That's one sulfate.","That ignores the subscript.","3 sulfates × 4 oxygens = 12.","That's the subscript only."]),
Q("How many atoms are in one formula unit of (NH₄)₂SO₄?",["7","10","15","9"],2,["That undercounts.","That omits some.","2N + 8H + 1S + 4O = 15.","That undercounts."]),
Q("What is the formula of sodium bicarbonate?",["NaHCO₃","Na₂CO₃","NaCO₃","NaOH"],0,["Na⁺ plus HCO₃⁻.","That's carbonate.","Charges don't balance.","That's hydroxide."]),
Q("What is the formula of ammonium nitrate?",["NH₄NO₃","(NH₄)₂NO₃","NH₄(NO₃)₂","NH₃NO₃"],0,["1+ and 1−.","Charges don't balance.","Charges don't balance.","Not ammonium."]),
Q("What is the formula of calcium acetate?",["CaC₂H₃O₂","Ca(C₂H₃O₂)₂","Ca₂C₂H₃O₂","Ca(CO₃)₂"],1,["2+ and 1−.","Ca²⁺ needs two acetates.","4+ and 1−.","That's carbonate."]),
Q("What is the formula of lead(II) nitrate?",["PbNO₃","Pb(NO₃)₂","Pb₂NO₃","Pb(NO₂)₂"],1,["2+ and 1−.","Two nitrates for Pb²⁺.","4+ and 1−.","That's nitrite."]),
Q("What is the formula of sodium phosphate?",["NaPO₄","Na₂PO₄","Na₃PO₄","Na₃(PO₄)₂"],2,["1+ and 3−.","2+ and 3−.","Three Na⁺ balance PO₄³⁻.","Wrong ratio."]),
Q("What is the formula of copper(II) sulfate?",["CuSO₄","Cu₂SO₄","Cu(SO₄)₂","CuS"],0,["2+ and 2−.","4+ and 2−.","2+ and 4−.","That's sulfide."]),
Q("What is the formula of magnesium hydroxide?",["MgOH","Mg(OH)₂","Mg₂OH","MgO₂H"],1,["2+ and 1−.","Mg²⁺ needs two OH⁻.","4+ and 1−.","Breaks the ion apart."]),
Q("What is the formula of lithium carbonate?",["LiCO₃","Li₂CO₃","Li(CO₃)₂","LiHCO₃"],1,["1+ and 2−.","Two Li⁺ for CO₃²⁻.","1+ and 4−.","That's bicarbonate."]),
Q("What is the formula of aluminum hydroxide?",["AlOH","Al(OH)₃","Al₃OH","Al₂(OH)₃"],1,["3+ and 1−.","Al³⁺ needs three OH⁻.","9+ and 1−.","6+ and 3−."]),
Q("What is NH₄Cl called?",["Ammonium chloride","Ammonia chloride","Nitrogen chloride","Ammonium chlorate"],0,["NH₄⁺ plus Cl⁻.","Wrong cation name.","Not ionic naming.","That's ClO₃⁻."]),
Q("What is Na₂SO₃ called?",["Sodium sulfate","Sodium sulfite","Sodium sulfide","Sodium thiosulfate"],1,["That's Na₂SO₄.","SO₃²⁻ is sulfite.","That's Na₂S.","That's Na₂S₂O₃."]),
Q("What is Mg₃(PO₄)₂ called?",["Magnesium phosphate","Magnesium phosphite","Trimagnesium phosphate","Magnesium phosphide"],0,["PO₄³⁻ is phosphate.","That's PO₃³⁻.","No prefixes in ionic names.","That's P³⁻."]),
Q("What is KMnO₄ called?",["Potassium manganate","Potassium permanganate","Potassium manganese oxide","Potassium manganite"],1,["That's K₂MnO₄.","MnO₄⁻ is permanganate.","Not correct.","Not standard."]),
Q("What is Ba(OH)₂ called?",["Barium hydroxide","Barium oxide hydride","Barium dihydroxide","Boron hydroxide"],0,["Ba²⁺ plus OH⁻.","Wrong name.","No prefixes.","Wrong cation."]),
Q("What is the charge on the dichromate ion?",["1−","2−","3−","1+"],1,["Too small.","Cr₂O₇²⁻.","Too large.","Not a cation."]),
Q("What is the formula of potassium dichromate?",["KCrO₄","K₂Cr₂O₇","K₂CrO₄","KCr₂O₇"],1,["Wrong ion.","Two K⁺ for Cr₂O₇²⁻.","That's chromate.","Charges don't balance."])
]},
{name:"Unit 1: Atomic Structure & Properties",qs:[
Q("Isotopes of the same element differ in their number of:",["Protons","Neutrons","Electrons","Atomic number"],1,["Protons define the element, so they stay the same.","Isotopes have different neutron counts and so different mass numbers.","Electrons change with charge, not with isotope.","Atomic number is the proton count, which is fixed per element."]),
Q("An element is 75% mass 35 and 25% mass 37. What is its average atomic mass?",["35.0","35.5","36.0","36.5"],1,["That ignores the contribution of the heavier isotope.","0.75(35) + 0.25(37) = 35.5.","That's the simple average, but you must weight by abundance.","That weights the wrong isotope more heavily."]),
Q("How many moles are in 22 g of CO₂ (molar mass 44 g/mol)?",["0.50 mol","2.0 mol","22 mol","0.050 mol"],0,["22 g ÷ 44 g/mol = 0.50 mol.","That divides 44 by 22, flipping the ratio.","22 is the mass in grams, not a number of moles.","Decimal slip. 22 ÷ 44 is 0.5, not 0.05."]),
Q("About how many molecules are in 0.50 mol of a substance?",["6.0 × 10²³","3.0 × 10²³","1.2 × 10²⁴","3.0 × 10²⁴"],1,["That's a full mole. You have half.","0.50 × 6.02 × 10²³ ≈ 3.0 × 10²³.","That's about 2 mol, not 0.5.","Power of ten is off by one."]),
Q("A mass spectrum of an element mainly shows:",["Bond angles","The relative abundance of its isotopes","Its number of valence electrons","Its melting point"],1,["Bond angles come from structure models, not mass spectra.","Each peak is an isotope's mass and its height is the abundance.","Valence electrons are probed with PES, not mass spectrometry.","Melting point is a physical property, not shown here."]),

H("50.0 mL of 0.40 M NaCl is mixed with 150.0 mL of 0.20 M CaCl₂. What is [Cl⁻] in the mixture?",["0.30 M","0.40 M","0.50 M","0.20 M"],1,["That averages the two stated molarities and ignores that CaCl₂ gives two Cl⁻ per unit.","Cl⁻ = 0.020 + 0.060 = 0.080 mol in 0.200 L = 0.40 M.","That overcounts the chloride from CaCl₂.","That is only the CaCl₂ molarity."])
);
addH(4,
H("25.0 mL of 0.100 M H₃PO₄ is titrated with 0.100 M NaOH until HPO₄²⁻ is the main species. What volume of NaOH is needed?",["25.0 mL","50.0 mL","75.0 mL","100 mL"],1,["That removes only one proton.","Two protons per H₃PO₄: 0.00250 × 2 = 0.00500 mol NaOH = 50.0 mL.","That removes all three protons (forming PO₄³⁻).","That is more than the full neutralization."]),
H("5Fe²⁺ + MnO₄⁻ + 8H⁺ → 5Fe³⁺ + Mn²⁺ + 4H₂O. 20.0 mL of 0.0200 M KMnO₄ is needed. How many moles of Fe²⁺ were present?",["4.00 × 10⁻⁴","2.00 × 10⁻³","8.00 × 10⁻⁵","1.00 × 10⁻²"],1,["That is the moles of MnO₄⁻ only, missing the 5 : 1 ratio.","MnO₄⁻ = 4.00 × 10⁻⁴ mol, and × 5 gives 2.00 × 10⁻³ mol Fe²⁺.","That divides by 5 instead of multiplying.","That uses the wrong volume conversion."])
);
addH(5,
H("Initial rates: [A], [B] = 0.10, 0.10 gives 2.0 × 10⁻³ M/s; 0.20, 0.10 gives 4.0 × 10⁻³; 0.20, 0.30 gives 3.6 × 10⁻². What are the rate law and k?",["rate = k[A][B]², k = 2.0 M⁻²s⁻¹","rate = k[A]²[B], k = 20 M⁻²s⁻¹","rate = k[A][B], k = 0.20 M⁻¹s⁻¹","rate = k[A][B]², k = 0.20 M⁻²s⁻¹"],0,["Doubling A doubles the rate (first order); tripling B gives ×9 (second order); k = 2.0 × 10⁻³ ÷ (0.10 × 0.10²) = 2.0.","A is first order, not second.","B is second order, not first.","The orders are right, but k is off by a factor of 10."]),
H("Step 1 (fast, equilibrium): 2NO ⇌ N₂O₂. Step 2 (slow): N₂O₂ + O₂ → 2NO₂. What is the rate law?",["k[NO]²[O₂]","k[N₂O₂][O₂]","k[NO][O₂]","k[NO]²"],0,["The slow step gives k₂[N₂O₂][O₂], and the fast equilibrium gives [N₂O₂] ∝ [NO]².","That is the slow step's rate, but it contains an intermediate.","That ignores the squared dependence from the equilibrium.","That drops O₂, which is in the slow step."])
);
addH(6,
H("1.00 g of a salt (80.0 g/mol) dissolves in 50.0 g of water in a calorimeter, and T drops from 25.0 to 22.8 °C. Take c = 4.18 J/g·°C for 51.0 g of solution. What is ΔH per mole of salt?",["+37.5 kJ/mol","−37.5 kJ/mol","+469 kJ/mol","+0.469 kJ/mol"],0,["q = 51.0 × 4.18 × 2.2 ≈ 469 J absorbed from the water; ÷ 0.0125 mol = +37.5 kJ/mol.","The solution cooled, so dissolving absorbed heat (positive ΔH).","That forgets to divide by moles.","That never converts the total heat to per mole."]),
H("C(s) + O₂ → CO₂ (ΔH = −393.5 kJ) and CO + ½O₂ → CO₂ (ΔH = −283.0 kJ). What is ΔH for C(s) + ½O₂ → CO?",["−110.5 kJ","−676.5 kJ","+110.5 kJ","−283.0 kJ"],0,["Reverse the second reaction and add: −393.5 + 283.0 = −110.5.","That adds the two without reversing the second.","That has the wrong sign.","That's the ΔH of CO combustion, not CO formation."])
);
addH(7,
H("N₂O₄ ⇌ 2NO₂ starts at 1.00 M N₂O₄ with no NO₂. At equilibrium [NO₂] = 0.30 M. What is K?",["0.11","0.090","0.35","0.21"],0,["N₂O₄ drops by 0.15 to 0.85 M; K = 0.30² ÷ 0.85 ≈ 0.11.","That forgets to divide by [N₂O₄].","That uses 0.30 ÷ 0.85 without squaring.","That subtracts the full 0.30 from N₂O₄."]),
H("Ksp of PbI₂ is 1.4 × 10⁻⁸. What is its solubility in 0.10 M NaI?",["1.4 × 10⁻⁶ M","1.5 × 10⁻³ M","1.4 × 10⁻⁷ M","1.2 × 10⁻⁴ M"],0,["[I⁻] ≈ 0.10, so s = Ksp ÷ (0.10)² = 1.4 × 10⁻⁶ M.","That is the solubility in pure water.","That divides by 0.10 only once.","That ignores the common ion."])
);
addH(8,
H("A 1.00 L buffer has 0.20 mol HA and 0.40 mol A⁻ (pKa 4.80). After adding 0.050 mol HCl, what is the pH?",["4.95","4.65","5.10","4.80"],0,["HA becomes 0.25 and A⁻ 0.35, so pH = 4.80 + log(0.35/0.25) ≈ 4.95.","That moves the ratio the wrong way.","That is the pH before adding HCl.","That equals pKa, which needs equal amounts."])
);
addH(9,
H("A reaction has ΔH° = −92 kJ and ΔS° = −199 J/K. Above what temperature does it become nonspontaneous?",["462 K","0.462 K","92 K","199 K"],0,["ΔG = 0 at T = ΔH/ΔS = 92,000 ÷ 199 ≈ 462 K, and above it TΔS wins.","That forgets to convert kJ to J.","That is ΔH's magnitude, not a temperature.","That is ΔS's magnitude, not a temperature."]),
H("E°cell = +0.46 V with n = 2 at 298 K. Roughly what is K?",["10¹⁵","10⁷","10¹","10⁻¹⁵"],0,["log K = nE°/0.0592 = 2(0.46)/0.0592 ≈ 15.5.","That uses n = 1 and an error in the factor.","That is far too small for this E°.","Positive E° means K > 1, not a tiny K."])
);

</script>
<script>
const app=document.getElementById('app');
let course,pool,idx,score,missed,label,streak=0,tier='mix',LP,gained=0;
let SAVE={xp:0,best:{},bestStreak:0};
try{Object.assign(SAVE,JSON.parse(localStorage.getItem('lockin')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('lockin',JSON.stringify(SAVE))}catch(e){}};
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const ready=c=>c.topics.filter(t=>t.qs.length);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const prep=q=>{const o=shuffle(q.o.map((_,i)=>i));return{q:q.q,hard:q.hard,o:o.map(i=>q.o[i]),a:o.indexOf(q.a),f:o.map(i=>q.f[i])}};
const lvl=()=>Math.floor(SAVE.xp/200)+1;
const hdr=back=>`<div class="top">${back||''}<span class="logo">AP QUIZZES</span><span class="sp"></span><span class="chip">⚡ Lv ${lvl()}</span><span class="chip">${SAVE.xp} XP</span></div>`;
const byTier=qs=>qs.filter(q=>tier=='hard'?q.hard:tier=='easy'?!q.hard:true);
function sample(ts,n){const L=ts.map(t=>shuffle(byTier(t.qs))),out=[];for(let i=0;out.length<n;i++){let any=false;for(const l of L)if(i<l.length&&out.length<n){out.push(l[i]);any=true}if(!any)break}return out}

function home(){
  app.innerHTML=hdr()+`<h1>Study smarter.<br>Not longer.</h1><p class="sub">Every wrong answer gets explained. Earn XP, build streaks, level up.</p>`+
  COURSES.map((c,i)=>{const n=ready(c).reduce((s,t)=>s+t.qs.length,0);return `<button class="card hero" onclick="pickCourse(${i})"><b>${c.name}</b><small>${n} questions · ${ready(c).length} topics</small></button>`}).join('')+
  `<p class="sub" style="margin-top:22px">Best streak: 🔥 ${SAVE.bestStreak}</p>`;
}
function pickCourse(i){
  course=COURSES[i];
  app.innerHTML=hdr('<button class="back" style="margin:0" onclick="home()">‹</button>')+`<h1>${course.name}</h1><p class="sub">Pick your grind.</p>
  <button class="card" onclick="chapters()"><b>📚 Chapter drills</b><small>One unit at a time, with your best score saved</small></button>
  <button class="card" onclick="lengthPick(-1)"><b>🧪 Full course mix</b><small>Random questions from every unit, like exam day</small></button>`+
  (course.poly?`<button class="card" onclick="drill()"><b>🧠 Polyatomic ion drill</b><small>80 tougher questions · closely related ions and formulas</small></button>`:'');
}
function chapters(){
  app.innerHTML=hdr('<button class="back" style="margin:0" onclick="pickCourse(COURSES.indexOf(course))">‹</button>')+`<h1>Chapters</h1><p class="sub">Your best score shows under each one.</p>`+
  course.topics.map((t,i)=>{const b=SAVE.best[t.name]||0;return `<button class="card" ${t.qs.length?'':'disabled'} onclick="lengthPick(${i})"><b>${esc(t.name)}</b><small>${t.qs.length} questions${b?' · best '+b+'%':''}</small><div class="meter"><i style="width:${b}%"></i></div></button>`}).join('');
}
function lengthPick(i){
  if(i!==undefined)LP={i,ts:i<0?ready(course):[course.topics[i]],name:i<0?'Full course mix':course.topics[i].name};
  const total=LP.ts.reduce((s,t)=>s+byTier(t.qs).length,0),hardN=LP.ts.reduce((s,t)=>s+t.qs.filter(q=>q.hard).length,0);
  const opts=(LP.i<0?[25,50,100]:[10,20,40]).filter(n=>n<total).concat(total?[total]:[]);
  app.innerHTML=hdr(`<button class="back" style="margin:0" onclick="${LP.i<0?'pickCourse(COURSES.indexOf(course))':'chapters()'}">‹</button>`)+`<h1>${esc(LP.name)}</h1><p class="sub">Choose difficulty and length.</p>
  <div class="pills">${[['easy','Warm-up'],['mix','Mixed'],['hard','Exam-level 🔥']].map(([k,n])=>`<button class="pill ${tier==k?'on':''}" onclick="tier='${k}';lengthPick()">${n}</button>`).join('')}</div>`+
  (opts.length?opts.map(n=>`<button class="card" onclick="go(${n})"><b>${n==total?'All '+n:n+' questions'}</b><small>${n==total?'The whole set, shuffled':'Random mix'}</small></button>`).join(''):`<p class="sub">No questions in this difficulty yet (${hardN} exam-level so far). Try Mixed.</p>`);
}
function go(n){start(sample(LP.ts,n),LP.name)}
function start(qs,name){pool=shuffle(qs).map(prep);label=name;idx=0;score=0;missed=[];streak=0;gained=0;show()}
function show(){
  const q=pool[idx];window.scrollTo(0,0);
  app.innerHTML=hdr('<button class="back" style="margin:0" onclick="'+(label==='Polyatomic ion challenge'?'exitDrill()':'if(confirm(\'Quit this round?\'))pickCourse(COURSES.indexOf(course))')+'">✕ Exit</button>')+
  `<div class="hud"><span>${idx+1}/${pool.length}</span><span class="sp"></span><span>🔥 ${streak}</span></div><div class="meter" style="margin:0 0 18px"><i style="width:${idx/pool.length*100}%"></i></div>`+
  (q.hard?'<span class="tag">EXAM-LEVEL</span>':'')+`<div class="q">${esc(q.q)}</div>`+
  q.o.map((o,k)=>`<button class="opt" onclick="answer(${k})"><span class="k">${k+1}</span><span>${esc(o)}</span></button>`).join('')+'<div id="fb"></div>';
}
function answer(k){
  const q=pool[idx],opts=[...document.querySelectorAll('.opt')];
  opts.forEach((b,i)=>{b.disabled=true;if(i==q.a)b.classList.add('ok');else if(i==k)b.classList.add('no')});
  let h,cls,xp=0;
  if(k==q.a){score++;streak++;SAVE.bestStreak=Math.max(SAVE.bestStreak,streak);xp=(q.hard?20:10)+Math.min(streak,5)*2;gained+=xp;SAVE.xp+=xp;
    h=`<p><b>Locked in.</b> ${esc(q.f[q.a])}</p>`;cls='good'}
  else{streak=0;missed.push({q:esc(q.q),pick:esc(q.o[k]),why:esc(q.f[k]),right:esc(q.o[q.a])});
    h=`<p><b>Not quite.</b> ${esc(q.f[k])}</p><p><b>Answer: ${esc(q.o[q.a])}.</b> ${esc(q.f[q.a])}</p>`;cls='bad'}
  if(xp){const p=document.createElement('div');p.className='pop';p.textContent='+'+xp+' XP';document.body.appendChild(p);setTimeout(()=>p.remove(),900)}
  save();const last=idx==pool.length-1;
  document.getElementById('fb').innerHTML=`<div class="fb ${cls}" role="status">${h}</div><button class="go" id="next" onclick="${last?'finish()':'idx++;show()'}">${last?'See results':'Next →'}</button>`;
  document.getElementById('next').focus();
}
function finish(){
  const pct=Math.round(score/pool.length*100);
  if(pct>(SAVE.best[label]||0))SAVE.best[label]=pct;save();
  const msg=pct==100?'Perfect. Absolute unit. 🏆':pct>=80?'Strong. Almost exam-ready.':pct>=60?'Getting there. Review the misses below.':'Rough round. That is how you learn it.';
  app.innerHTML=hdr()+`<p class="sub">${esc(label)}</p><p class="big">${score}/${pool.length}</p><p class="sub">${msg} +${gained} XP this round.</p>`+
  (missed.length?'<h2 style="font-size:1.1rem">Review your misses</h2><ul style="padding-left:1.1em">'+missed.map(m=>`<li><b>${m.q}</b><br>You picked ${m.pick}. ${m.why}<br><b>Answer:</b> ${m.right}</li>`).join('')+'</ul>':'')+
  `<button class="go" onclick="label=='Polyatomic ion challenge'?drill():start(pool,label)">Run it back</button><button class="card" style="margin-top:10px;text-align:center" onclick="pickCourse(COURSES.indexOf(course))">Back to ${course.name}</button>`;
}
function exitDrill(){
  if(!confirm('Exit the polyatomic quiz and return to the AP Chemistry menu?')) return;
  if(course) pickCourse(COURSES.indexOf(course));
  else home();
}
function drill(){
  // Build 80 distinct, more challenging recall questions from the full ion bank.
  // Every ion appears in at least one direction; 36 ions also appear in the reverse direction.
  const ions=shuffle(POLY);
  const questions=[];
  const makeOptions=(ion, toName)=>{
    const related=ions.filter(x=>x!==ion && x.g===ion.g);
    const other=ions.filter(x=>x!==ion && x.g!==ion.g);
    const distractors=shuffle(related).concat(shuffle(other)).slice(0,3);
    const choices=shuffle([ion,...distractors]);
    return {
      o:choices.map(x=>toName?x.n:x.f),
      a:choices.indexOf(ion),
      f:choices.map(x=>x===ion
        ? `${ion.f} is ${ion.n}.`
        : toName
          ? `${x.f} is ${x.n}, not ${ion.n}.`
          : `${x.n} is ${x.f}, not ${ion.f}.`)
    };
  };
  // Formula → name for all 44 ions.
  ions.forEach(ion=>{
    const v=makeOptions(ion,true);
    questions.push({q:`Identify the polyatomic ion ${ion.f}.`,...v});
  });
  // Name → formula for 36 additional ions, giving exactly 80 questions.
  ions.slice(0,36).forEach(ion=>{
    const v=makeOptions(ion,false);
    questions.push({q:`Which formula correctly represents ${ion.n}?`,...v});
  });
  pool=shuffle(questions);
  label='Polyatomic ion challenge';
  idx=0;score=0;missed=[];streak=0;gained=0;
  show();
}
document.addEventListener('keydown',e=>{
  const n=document.getElementById('next');
  if(e.key=='Enter'&&n&&document.activeElement!==n){n.click();return}
  const b=document.querySelectorAll('.opt'),k=+e.key;
  if(k>=1&&k<=b.length&&!b[k-1].disabled)b[k-1].click();
});
home();
</script>
</body>
